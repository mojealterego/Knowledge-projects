name: OCAF Agents 012-013 Rust and Python
on:
  pull_request:
    paths:
      - "OCAF Agents MOJEALTEREGO/OCAF-AGENT-012/**"
      - "OCAF Agents MOJEALTEREGO/OCAF-AGENT-013/**"
      - "OCAF Agents MOJEALTEREGO/AGENT_IDENTITY_REGISTRY.json"
      - ".github/workflows/ocaf-agents-012-013.yml"
  push:
    branches: [main]
    paths:
      - "OCAF Agents MOJEALTEREGO/OCAF-AGENT-012/**"
      - "OCAF Agents MOJEALTEREGO/OCAF-AGENT-013/**"
      - "OCAF Agents MOJEALTEREGO/AGENT_IDENTITY_REGISTRY.json"
      - ".github/workflows/ocaf-agents-012-013.yml"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        agent: ["012", "013"]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - name: Rust format
        run: cargo fmt --manifest-path "OCAF Agents MOJEALTEREGO/OCAF-AGENT-${{ matrix.agent }}/Cargo.toml" -- --check
      - name: Rust tests
        run: cargo test --manifest-path "OCAF Agents MOJEALTEREGO/OCAF-AGENT-${{ matrix.agent }}/Cargo.toml" --all-features
      - name: Clippy
        run: cargo clippy --manifest-path "OCAF Agents MOJEALTEREGO/OCAF-AGENT-${{ matrix.agent }}/Cargo.toml" --all-targets --all-features -- -D warnings
      - name: Python originals
        run: |
          if [[ "${{ matrix.agent }}" == "012" ]]; then
            python3 -m unittest discover -s tools -p 'test_program_claim_gate.py' -v
          else
            python3 -m unittest discover -s tools -p 'test_communication_link_policy.py' -v
          fi
      - name: CLI smoke
        run: cargo run --manifest-path "OCAF Agents MOJEALTEREGO/OCAF-AGENT-${{ matrix.agent }}/Cargo.toml" -- demo
