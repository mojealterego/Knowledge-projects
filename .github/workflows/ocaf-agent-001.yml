name: Agent 001 Rust and OCAF verification
on:
  pull_request:
    paths:
      - "OCAF Agents MOJEALTEREGO/OCAF-AGENT-001/**"
      - ".github/workflows/ocaf-agent-001.yml"
  push:
    branches: [main]
    paths:
      - "OCAF Agents MOJEALTEREGO/OCAF-AGENT-001/**"
      - ".github/workflows/ocaf-agent-001.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-001:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check preserved JavaScript
        run: |
          node --check "OCAF Agents MOJEALTEREGO/OCAF-AGENT-001/legacy-pwa/server.mjs"
          node --check "OCAF Agents MOJEALTEREGO/OCAF-AGENT-001/legacy-pwa/public/app.js"
      - name: Formatting
        run: cargo fmt --manifest-path "OCAF Agents MOJEALTEREGO/OCAF-AGENT-001/Cargo.toml" -- --check
      - name: Rust unit, integration and security tests
        run: cargo test --manifest-path "OCAF Agents MOJEALTEREGO/OCAF-AGENT-001/Cargo.toml" --all-features
      - name: Strict Clippy
        run: cargo clippy --manifest-path "OCAF Agents MOJEALTEREGO/OCAF-AGENT-001/Cargo.toml" --all-targets --all-features -- -D warnings
      - name: CLI local smoke
        run: cargo run --manifest-path "OCAF Agents MOJEALTEREGO/OCAF-AGENT-001/Cargo.toml" -- "adjust highlights"
