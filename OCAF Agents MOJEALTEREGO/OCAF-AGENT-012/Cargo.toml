[package]
name = "fides_grantis_agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline research and grant program claim review with fail-closed historical status"

[features]
default = ["ocaf-integration"]
ocaf-integration = ["dep:ocaf_runtime", "dep:async-trait"]

[dependencies]
ocaf_runtime = { git = "https://github.com/mojealterego/ocaf-runtime", rev = "52d4f597e0b481678f90cf2073b721ad2e99e253", default-features = false, optional = true }
async-trait = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["rt", "macros"] }
