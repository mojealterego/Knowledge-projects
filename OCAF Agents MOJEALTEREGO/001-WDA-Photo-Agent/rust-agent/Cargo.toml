[package]
name = "wda_photo_agent"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Agent 001: read-only photographic planning for OCAF Runtime"

[features]
default = []
ocaf-integration = ["dep:ocaf_runtime", "dep:async-trait", "dep:serde_json"]

[dependencies]
ocaf_runtime = { git = "https://github.com/mojealterego/ocaf-runtime", rev = "52d4f597e0b481678f90cf2073b721ad2e99e253", default-features = false, optional = true }
async-trait = { version = "0.1", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1.38", features = ["rt", "macros"] }
