# Registry identity of OCAF Agent 001.
# Network activation and OSTc source access intentionally remain off.
[identity]
agent_id = "AM-OCAF-AI-0001"
registry_number = "001"

[servers]
agent_server = "OMAs"
tool_server = "OMAt"

[communication]
transport = "Zenoh"
network_enabled = false
authenticated_tls_required = true

[source_access]
enabled = false
encryption = "OSTc"
specification_status = "PENDING"

[safety]
identity_lock_required = true
max_goal_bytes = 1024
