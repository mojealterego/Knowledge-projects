[package]
name = "custos_admission_agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust port of tools/agent_tool_admission_gate.py with independently provided approvals"

[features]
default = ["ocaf-integration"]
ocaf-integration = ["dep:ocaf_runtime", "dep:async-trait"]

[dependencies]
ocaf_runtime = { git = "https://github.com/mojealterego/ocaf-runtime", rev = "52d4f597e0b481678f90cf2073b721ad2e99e253", default-features = false, optional = true }
async-trait = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["rt", "macros"] }